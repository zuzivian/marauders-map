<html><body><script class="ds:1" nonce="1kaO9sjtb0AxeEKCwxdCrg">AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["93402210922046150","Finance MBA Intern, 2027",null,[null,"\u003cul\u003e\n\u003cli\u003eCollaborate with Product Management, Engineering, Sales, Operations, and Finance teams to identify, analyze, improve, and implement financial processes and systems.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eDevelop and refine our budgeting and planning processes in partnership with team leaders.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eAnalyze key performance and operational as well as financial metrics (e.g., business generation, productivity metrics, other key business drivers) and identify areas for improvements.\u003c/li\u003e\n\u003cli\u003eParticipate in discussions and develop analytical models to support company initiatives and/or financial decisions.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a MBA degree program in the EMEA region.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003e4 years of experience prior to starting the MBA.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience demonstrating process engineering and analytical skills with an understanding of corporate finance concepts (e.g., credit risk, cash flow).\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience demonstrating the ability to use critical thinking skills to solve highly strategic and difficult business problems.\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience demonstrating project management, communication, and organisational skills, with the ability to drive and implement ideas in a changing environment.\u003c/li\u003e\n\u003cli\u003eCurrently in your penultimate/final year of education.\u003c/li\u003e\n\u003cli\u003eAbility to complete a minimum 13 week full-time internship in Ireland starting in either May, June or July 2027.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Dublin, Ireland",["Barrow St, Dublin, Ireland"],"Dublin",null,"D","IE"]],[null,"\u003cp\u003eOur MBA Internship Program will immerse you into the tech industry on a high-impact team. You’ll enhance your skill set, be challenged with rigorous work, grow your network and drive meaningful change in our business. Outside of your core work, you will participate in a program that exposes you to Google’s business operations, connects you with interns and Googlers, and invests in your personal and professional development.\u003c/p\u003e\u003cdiv\u003eFinancial Operations (FinOps), Business Controller and Operations is responsible for almost all transactions at Google having to do with money on both, payables and receivables sides. Our systems have to be global, scalable, and ever-adapting to our new products and new regions we are entering. There are four major divisions within FinOps - Revenue to Cash Operations (RCO), Revenue Platforms (RP), Google Business Services (GBS), and Compass. As an MBA intern in any one of these teams, you will be working with large datasets and in a complex, global environment.\u003cbr\u003e\u003c/div\u003e\u003cp\u003eThe idea for Gmail began with 1 Googler. Today it has more than 1 billion users and counting.\u003cbr\u003e\u003cbr\u003eAt Google, one Googler can make a huge impact, and it’s no different with our interns--they are key players in our daily innovation. As an intern, you’ll have the opportunity to work on projects core to Google’s business, whether it be Sales, Enterprise, Finance, People Operations (HR), Legal, Trust and Safety, or Marketing. Our intern recruitment team will determine where you fit best based on your CV and the preferences you indicate on the application form.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eIreland: €72000 (EUR) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.\u003c/p\u003e"],[3],[1790946563,56000000],[1790946563,56000000],[1790946563,163000000],[null,"\u003cp\u003e Applications for this role will open on October 5, 2026.\u003c/p\u003e\u003cp\u003ePlease complete your application before \u003cb\u003eNovember 13, 2026\u003c/b\u003e. We encourage you to apply as early as possible as we review applications on a rolling basis.\u003c/p\u003e\u003cdiv\u003eThis internship is intended for students enrolled in their penultimate/final year of education in an accredited MBA degree program located in the EMEA region. Participation in the internship program requires that you are located in Ireland for the duration of the internship program. Interns will be required to be available to work full-time for a minimum of 13 weeks over the Summer 2027 (starting in May, June or July) for the duration of the program. Individuals applying for this position will not be eligible for immigration sponsorship.\u003cbr\u003e\u003cbr\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about an application, we likely proceeded with other candidates for that particular role. However, our recruiters might reach out if we find a different potential match for your skills, interests, and experience.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):\u003cbr\u003e\u003col\u003e\u003cli\u003eIn the “Resume Section:” attach an updated CV or resume\u003c/li\u003e\u003cli\u003eIn the “Education Section:” attach a current or recent unofficial or official transcript in English.\u003c/li\u003e\u003cli\u003eUnder “Degree Status,” select “Now attending” to upload a transcript.\u003c/li\u003e\u003c/ol\u003ePlease include your expected graduation date (month and year), and availability for the internship on your resume. The specific team and project(s) will be determined based on your educational background, interest and skills.\u003c/div\u003e"],null,null,[null,""],[null,"\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a MBA degree program in the EMEA region.\u003c/li\u003e\n\u003c/ul\u003e"],5],["82600333812867782","Business Analyst MBA Intern, 2027",null,[null,"\u003cul\u003e\n\u003cli\u003eTranslate low complexity metrics and analysis into formats that enable supported teams to quickly and easily derive relevant information.\u003c/li\u003e\n\u003cli\u003eExecute complete tasks within the scope of a larger project, including designing dashboards and maintaining data pipelines.\u003c/li\u003e\n\u003cli\u003eContribute to reviewing and validating data as it’s collected, and perform data profiling tasks to identify and highlight anomalies.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a MBA degree program in the EMEA region\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience working in data analytics, consulting, data science, engineering, or a technical operations role.\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience in statistical problem solving and analysing data sets using SQL or comparable coding language (e.g. Python, R, Java, C++).\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eRelevant practical or internship experience designing data-driven experiments, developing statistical models, measurement, and identifying business opportunities.\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience working with data analysis tools (e.g., BigQuery etc).\u003c/li\u003e\n\u003cli\u003eExperience exchanging information and knowledge, and the ability to develop working relationships within your own team to contribute to cross-project collaborations.\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience in data analysis, with the ability to solve problems in complex, fast-moving, and ambiguous business environments through solid data intuition and business acumen, as well as influencing senior leadership on analytical decision making.\u003c/li\u003e\n\u003cli\u003eAbility to effectively communicate analysis and recommendations across a wide range of non-technical audiences.\u003c/li\u003e\n\u003cli\u003eAbility to complete a minimum 13 week full-time internship in Ireland starting in either May, June or July 2027.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Dublin, Ireland",["Barrow St, Dublin, Ireland"],"Dublin",null,"D","IE"]],[null,"\u003cp\u003eOur MBA Internship Program will immerse you into the tech industry on a high-impact team. You’ll enhance your skill set, be challenged with rigorous work, grow your network and drive meaningful change in our business. Outside of your core work, you will participate in a program that exposes you to Google’s business operations, connects you with interns and Googlers, and invests in your personal and professional development.\u003c/p\u003eAs a Business Analyst Intern, you will have the opportunity to support the data-driven processes that allow us to scale our business. In this role, you will execute tasks within the scope of larger projects, assisting in defining and reporting key metrics to evaluate business initiatives. You will gain valuable experience by supporting our senior business analysts with data management and reporting, helping to translate analysis into insights that drive product sales acceleration.\u003cp\u003eThe idea for Gmail began with 1 Googler. Today it has more than 1 billion users and counting.\u003cbr\u003e\u003cbr\u003eAt Google, one Googler can make a huge impact, and it’s no different with our interns--they are key players in our daily innovation. As an intern, you’ll have the opportunity to work on projects core to Google’s business, whether it be Sales, Enterprise, Finance, People Operations (HR), Legal, Trust and Safety, or Marketing. Our intern recruitment team will determine where you fit best based on your CV and the preferences you indicate on the application form.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eIreland: €72000 (EUR) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.  \u003c/p\u003e"],[3],[1790919372,369000000],[1790943097,816000000],[1790943099,526000000],[null,"\u003cdiv\u003eApplications will open on Monday 5th October 2026.\u003c/div\u003e\u003cp\u003ePlease complete your application before 13th November 2026. We encourage you to apply as early as possible as we review applications on a rolling basis.\u003c/p\u003e\u003cp\u003eThis internship is intended for students enrolled in their penultimate/final year of education in an accredited MBA degree program located in the EMEA region. Participation in the internship program requires that you are located in Ireland for the duration of the internship program. Interns will be required to be available to work full-time for a minimum of 13 weeks over the Summer 2027 (starting in May, June or July) for the duration of the program. Individuals applying for this position will not be eligible for immigration sponsorship.\u003cbr\u003e\u003cbr\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about an application, we likely proceeded with other candidates for that particular role. However, our recruiters might reach out if we find a different potential match for your skills, interests, and experience.\u003cbr\u003e\u003cbr\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):\u003cbr\u003e\u003c/p\u003e\u003col\u003e\u003cli\u003eIn the “Resume Section:” attach an updated CV or resume\u003c/li\u003e\u003cli\u003eIn the “Education Section:” attach a current or recent unofficial or official transcript in English.\u003c/li\u003e\u003cli\u003eUnder “Degree Status,” select “Now attending” to upload a transcript.\u003c/li\u003e\u003c/ol\u003ePlease include your expected graduation date (month and year), and availability for the internship on your resume. The specific team and project(s) will be determined based on your educational background, interest and skills.\u003cbr\u003e"],null,null,[null,""],[null,"\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a MBA degree program in the EMEA region\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience working in data analytics, consulting, data science, engineering, or a technical operations role.\u003c/li\u003e\n\u003cli\u003eRelevant practical or internship experience in statistical problem solving and analysing data sets using SQL or comparable coding language (e.g. Python, R, Java, C++).\u003c/li\u003e\n\u003c/ul\u003e"],5],["99770582270124742","Strategy and Operations MBA Intern, 2027",null,[null,"\u003cul\u003e\n\u003cli\u003eInfluence executive-level decision-making around core business decisions, such as prioritisation of growth opportunities, through scalable and actionable analytical insights.\u003c/li\u003e\n\u003cli\u003eProvide business insights, ensure cross-functional alignment, drive strategic partnerships, manage the rhythm of the business activities and execute on new initiatives. \u003c/li\u003e\n\u003cli\u003eBe a trusted advisor to your organization and their leadership team, communicating, structuring, and problem-solving complex and ambiguous business challenges while supporting organization priorities.\u003c/li\u003e\n\u003cli\u003eOrganize the design and implementation of business cadence to deliver effective operations and achieve key milestones.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003e\u003cdiv\u003e\u003cdiv\u003eCurrently enrolled in a MBA degree program in the EMEA region.\u003c/div\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli\u003eRelevant internship or practical experience in strategy consulting, finance or corporate strategy.\u003c/li\u003e\n\u003cli\u003eRelevant internship or practical experience tailoring and delivering reporting and presentations by audience, asking strategic questions, and leading conversations that drive results and efficiencies.\u003c/li\u003e\n\u003cli\u003eRelevant internship or practical experience presenting to senior stakeholders, both in presentation and in creating content that is executive-ready.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eRelevant internship or practical experience in Go-to-Market Strategy, Strategic Projects Management or Program Management for a tech company or consumer goods company.\u003c/li\u003e\n\u003cli\u003eRelevant internship or practical experience collaborating with cross-functional teams and influencing without authority to drive operational excellence, successful delivery of priority initiatives, process improvements, and change management.\u003c/li\u003e\n\u003cli\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003eExcellent problem solving skills, with experience leading analytical work to test and drive a hypothesis forward. \u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli\u003eAbility to complete a minimum 13 week full-time internship in the UK starting in either May, June, or July 2027.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["London, UK",["1 St Giles High St, London WC2H 8JR, UK"],"London","WC2H 8JR","England","GB"]],[null,"\u003cp\u003eOur MBA Internship Program will immerse you into the tech industry on a high-impact team. You’ll enhance your skill set, be challenged with rigorous work, grow your network and drive meaningful change in our business. Outside of your core work, you will participate in a program that exposes you to Google’s business operations, connects you with interns and Googlers, and invests in your personal and professional development.\u003c/p\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003eAs a Strategy and Operations Intern, you will be part of the team that is responsible for defining, landing and executing on our key strategic priorities to drive long term business growth. You will provide business insights, ensure cross-functional alignment, drive strategic partnerships, and execute new initiatives. The organization's goal is to align company priorities with day-to-day operations and evolve early-stage ideas into future growth initiatives.\u003cp\u003eThe idea for Gmail began with 1 Googler. Today it has more than 1 billion users and counting.\u003cbr\u003e\u003cbr\u003eAt Google, one Googler can make a huge impact, and it’s no different with our interns--they are key players in our daily innovation. As an intern, you’ll have the opportunity to work on projects core to Google’s business, whether it be Sales, Enterprise, Finance, People Operations (HR), Legal, Trust and Safety, or Marketing. Our intern recruitment team will determine where you fit best based on your CV and the preferences you indicate on the application form.\u003c/p\u003e"],[3],[1790946564,720000000],[1790946564,720000000],[1790946564,861000000],[null,"\u003cp\u003eApplications for this role will open on \u003cb\u003eOctober 5, 2026\u003c/b\u003e.\u003c/p\u003e\u003cp\u003ePlease complete your application before \u003cb\u003eNovember 13, 2026\u003c/b\u003e. We encourage you to apply as early as possible as we review applications on a rolling basis.\u003c/p\u003e\u003cdiv\u003e\u003cdiv\u003eThis internship is intended for students enrolled in their penultimate/final year of education in an accredited MBA degree program located in the EMEA region. Participation in the internship program requires that you are located in the UK for the duration of the internship program. Interns will be required to be available to work full-time for a minimum of 13 weeks over the Summer 2027 (starting in May, June or July) for the duration of the program. Individuals applying for this position will not be eligible for immigration sponsorship.\u003cbr\u003e\u003cbr\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about an application, we likely proceeded with other candidates for that particular role. However, our recruiters might reach out if we find a different potential match for your skills, interests, and experience.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):\u003cbr\u003e\u003col\u003e\u003cli\u003eIn the “Resume Section:” attach an updated CV or resume\u003c/li\u003e\u003cli\u003eIn the “Education Section:” attach a current or recent unofficial or official transcript in English.\u003c/li\u003e\u003cli\u003eUnder “Degree Status,” select “Now attending” to upload a transcript.\u003c/li\u003e\u003c/ol\u003ePlease include your expected graduation date (month and year), and availability for the internship on your resume. The specific team and project(s) will be determined based on your educational background, interest and skills.\u003c/div\u003e\u003c/div\u003e"],null,null,[null,""],[null,"\u003cul\u003e\n\u003cli\u003e\u003cdiv\u003e\u003cdiv\u003eCurrently enrolled in a MBA degree program in the EMEA region.\u003c/div\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli\u003eRelevant internship or practical experience in strategy consulting, finance or corporate strategy.\u003c/li\u003e\n\u003cli\u003eRelevant internship or practical experience tailoring and delivering reporting and presentations by audience, asking strategic questions, and leading conversations that drive results and efficiencies.\u003c/li\u003e\n\u003cli\u003eRelevant internship or practical experience presenting to senior stakeholders, both in presentation and in creating content that is executive-ready.\u003c/li\u003e\n\u003c/ul\u003e"],5]],null,3,20], sideChannel: {}});</script></body></html>
