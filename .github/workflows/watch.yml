# Daily data refresh: checks every company's careers API for MBA internships (scripts/watch-postings.mjs), refreshes
# revenue growth from SEC filings when SEC_USER_AGENT is set, and, if the data changed and every test and the build
# pass, commits it to main and publishes the site. Nobody has to merge anything for a new posting to go live.
#
# A person still reviews, just after the fact: each run that changes data posts its report as a comment on one
# rolling issue ("Posting watcher: what changed"), whose "Needs a human" section lists status sentences rewritten
# from the template and postings only a person can judge. A failed run comments on a "Posting watcher is failing"
# issue (closed again by the next good run), so a break can't go unnoticed for a week.
#
# Run it by hand from any branch to try it: only main publishes or comments. Elsewhere it stops after the build.
#
# Settings it uses:
#   - repository variable SEC_USER_AGENT ("Name email@domain", SEC policy): optional; without it growth isn't refreshed.
#   - deploy.yml's HERENOW_API_KEY secret, as before.
# Pushes made with GITHUB_TOKEN don't start other workflows, so this one starts deploy.yml itself.

name: Watch postings

on:
  schedule:
    - cron: "7 15 * * *" # about 15:00 UTC, 8am Pacific (7am in winter); off the hour, when Actions is less busy
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: watch-postings
  cancel-in-progress: false

env:
  CHANGES_ISSUE: "Posting watcher: what changed"
  FAILING_ISSUE: "Posting watcher is failing"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check careers sites
        run: npm run watch -- --write --mark-gone --report="$RUNNER_TEMP/report.md"

      # SEC outages or a company's missing XBRL shouldn't hold back new postings, so this step may fail on its own.
      - name: Refresh revenue growth from SEC filings
        if: vars.SEC_USER_AGENT != ''
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: npm run -s refresh:sec -- --write

      # The same gate deploy.yml uses: the data tests, then a full static export with the new data.
      - name: Test and build
        run: npm run build

      - name: Commit to main and publish
        id: publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Watcher run $(date -u +%F)"
          # Someone may have pushed to main during the run; replay this commit on top of theirs.
          pushed=""
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git pull --rebase origin main
          done
          [ -n "$pushed" ] || { echo "::error::Couldn't push to main after 3 tries."; exit 1; }
          echo "committed=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          gh workflow run deploy.yml --ref main

      - name: Post the report
        if: steps.publish.outputs.committed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.publish.outputs.committed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          { cat "$RUNNER_TEMP/report.md"; echo; echo "_Published as $SHA by [this run]($RUN). Fix anything wrong with a normal commit to main; the watcher builds on whatever main holds._"; } | head -c 60000 > "$body"
          n=$(gh issue list --state open --search "in:title \"$CHANGES_ISSUE\"" --json number,title -q ".[] | select(.title == \"$CHANGES_ISSUE\") | .number" | head -1)
          if [ -z "$n" ]; then
            gh issue create --title "$CHANGES_ISSUE" --body "The daily watcher publishes data changes to main by itself and comments here each time it does. Read the **Needs a human** section of each report: add context to rewritten status sentences, and check postings it couldn't judge. Close this issue whenever; the next change opens a new one."
            n=$(gh issue list --state open --search "in:title \"$CHANGES_ISSUE\"" --json number,title -q ".[] | select(.title == \"$CHANGES_ISSUE\") | .number" | head -1)
          fi
          gh issue comment "$n" --body-file "$body"

      - name: Clear the failing notice
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --state open --search "in:title \"$FAILING_ISSUE\"" --json number,title -q ".[] | select(.title == \"$FAILING_ISSUE\") | .number"); do
            gh issue close "$n" --comment "Recovered: the $(date -u +%F) run passed."
          done

      - name: Report the failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg="The $(date -u +%F) run failed, so nothing was published: $RUN"
          n=$(gh issue list --state open --search "in:title \"$FAILING_ISSUE\"" --json number,title -q ".[] | select(.title == \"$FAILING_ISSUE\") | .number" | head -1)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$msg"
          else
            gh issue create --title "$FAILING_ISSUE" --body "$msg. The site keeps showing the last published data (and says how old it is) until a run passes. The log names the failing step."
          fi
